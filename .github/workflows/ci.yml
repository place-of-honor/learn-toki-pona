name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-and-data-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Reject JavaScript and Node package residue
        run: |
          set -eu
          bad="$(
            find . -type f \( \
              -name '*.js' -o \
              -name 'package.json' -o \
              -name 'package-lock.json' \
            \) -print
          )"
          test -z "$bad" || {
            printf '%s\n' "$bad"
            exit 1
          }

      - name: Check quiz and word-file shape
        run: |
          set -eu
          test "$(grep -Ec '^[1-7]\. [A-Z]' quizzes.txt)" -eq 7
          test "$(grep -Ec '^[1-7]\.[1-8] [a-z0-9-]+$' quizzes.txt)" -eq 56
          test "$(find tokipona -type f | wc -l)" -eq 178
          find tokipona -type f -print | while IFS= read -r file
          do
            test "$(wc -l < "$file")" -eq 1
            if od -An -tx1 "$file" | grep -qw '00'
            then
              printf 'NUL byte in %s\n' "$file"
              exit 1
            fi
          done

      - name: Reject retired WebView application layers
        run: |
          set -eu
          test ! -e app/src/gradle/java/org/tokipona/drills/MainActivity.java
          test ! -e app/src/main/smali/org/tokipona/drills/MainActivity.smali
          ! grep -R -n 'android.webkit.WebView' app || true
          grep -Fq 'android.app.NativeActivity' app/src/main/AndroidManifest.xml

  native-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compile and run quiz parser
        run: |
          set -eu
          cc \
            -std=c17 -O2 \
            -Wall -Wextra -Werror -Wpedantic -Wconversion -Wshadow \
            -Iapp/src/main/c \
            app/src/main/c/quiz_model.c \
            app/src/main/c/quiz_model_test.c \
            -o /tmp/toki-pona-quiz-model-test
          /tmp/toki-pona-quiz-model-test quizzes.txt

  build-native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, build tools, and NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Build native APK
        run: scripts/build_apk.sh

      - name: Verify NativeActivity package
        run: |
          set -eu
          apk=build/Toki-Pona-Drills-native-v1.1.0.apk
          test -s "$apk"
          unzip -l "$apk" > /tmp/apk-files.txt
          grep -Fq 'assets/quizzes.txt' /tmp/apk-files.txt
          grep -Fq 'lib/armeabi-v7a/libtokipona_drills.so' /tmp/apk-files.txt
          grep -Fq 'lib/arm64-v8a/libtokipona_drills.so' /tmp/apk-files.txt
          grep -Fq 'lib/x86_64/libtokipona_drills.so' /tmp/apk-files.txt
          ! grep -Fq 'classes.dex' /tmp/apk-files.txt

          badging="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='org.tokipona.drills'" >/dev/null
          printf '%s\n' "$badging" | grep -F "launchable-activity: name='android.app.NativeActivity'" >/dev/null

      - name: Upload native APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toki-pona-native-debug-apk
          path: build/Toki-Pona-Drills-native-v1.1.0.apk
          if-no-files-found: error

  build-play-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK, and CMake
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Build unsigned native app bundle
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Verify native app bundle
        run: |
          set -eu
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          unzip -l "$bundle" > /tmp/aab-files.txt
          grep -Fq 'base/assets/quizzes.txt' /tmp/aab-files.txt
          grep -Fq 'base/lib/armeabi-v7a/libtokipona_drills.so' /tmp/aab-files.txt
          grep -Fq 'base/lib/arm64-v8a/libtokipona_drills.so' /tmp/aab-files.txt
          grep -Fq 'base/lib/x86_64/libtokipona_drills.so' /tmp/aab-files.txt
          ! grep -Fq 'classes.dex' /tmp/aab-files.txt
          ! grep -Fq 'base/dex/' /tmp/aab-files.txt
