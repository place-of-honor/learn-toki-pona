name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run content and progress tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run offline browser smoke test
        run: npm run test:browser

  rebuild-and-verify-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android signing tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "build-tools;35.0.1"

      - name: Download pinned Apktool
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          echo "effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd  /tmp/apktool.jar" \
            | sha256sum --check

      - name: Rebuild, sign, and verify APK
        run: |
          scripts/build_apk.sh \
            /tmp/apktool.jar \
            "$ANDROID_SDK_ROOT/build-tools/35.0.1/zipalign" \
            "$ANDROID_SDK_ROOT/build-tools/35.0.1/lib/apksigner.jar"

      - name: Check rebuilt APK
        run: test -s build/Toki-Pona-Drills-v1.0.1.apk

  build-play-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build unsigned release bundle
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Check app bundle
        run: test -s app/build/outputs/bundle/release/app-release.aab
