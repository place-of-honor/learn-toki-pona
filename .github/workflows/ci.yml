name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-and-data-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Reject JavaScript and Node package residue
        run: |
          set -eu
          bad="$(
            find . -type f \(               -name '*.js' -o               -name 'package.json' -o               -name 'package-lock.json'             \) -print
          )"
          test -z "$bad" || {
            printf '%s\n' "$bad"
            exit 1
          }

      - name: Require every retired source in the Fieldmouse manifest
        run: |
          set -eu
          for blob in             2fde00b77cb133c9ef4ac099ea5f4b0d9b906253             06384c25fef2f33d88596f8c445d8fa1d7314a2a             a20fd8317447d858624516326e9863f72e73a2d0             485495e13a419d6728f33b4e696458914fa5cf90             b4cf8ab0cc24a24dcca8ab9a1bfee5c4089e23bf             691dd2898cde091ab11f231dacb39140160e6e02             4804cbee1c7e8126829ad6ca8a399319657694d7             5655df62576a62f9308c3b2c5cec4e70a0452a0c             25a35356aefda63d324438dbfbdd45d8ec903f7f             06b4849c14c50bb7519c6d45080b51224131d68b             aa3653fbd9d6a34585f64bc8448c0fd28ccffa94
          do
            grep -q "$blob" fieldmouse/README.txt
          done

      - name: Check quiz and word-file shape
        run: |
          set -eu
          test "$(grep -Ec '^[1-7]\. [A-Z]' quizzes.txt)" -eq 7
          test "$(grep -Ec '^[1-7]\.[1-8] [a-z0-9-]+$' quizzes.txt)" -eq 56
          test "$(find tokipona -type f | wc -l)" -eq 178

          find tokipona -type f -print | while IFS= read -r file
          do
            test "$(wc -l < "$file")" -eq 1
            if od -An -tx1 "$file" | grep -qw '00'
            then
              printf 'NUL byte in %s\n' "$file"
              exit 1
            fi
          done

      - name: Check terminal and retired-browser boundaries
        run: |
          set -eu
          test -s grease/toki-pona.ysh
          test -s TokiPonaQuizTypes.idric
          ! grep -q '<script' app/src/main/assets/www/index.html
          grep -q 'Grease terminal program' app/src/main/assets/www/index.html


  native-ui-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compile native UI core and run interaction tests
        run: |
          set -eu
          cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 \
            app/native/exercise_model.c \
            tests/native_exercise_model_test.c \
            -o /tmp/native-exercise-model-test
          /tmp/native-exercise-model-test

          cc -std=c17 -Wall -Wextra -Werror -pedantic -O2 -Iapp/native \
            app/native/canvas.c \
            app/native/exercise_model.c \
            app/native/native_ui.c \
            tests/native_ui_test.c \
            -o /tmp/native-ui-test
          /tmp/native-ui-test

  build-native-bundle:
    needs:
      - language-and-data-boundaries
      - native-ui-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36, NDK r30, and CMake
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370 cmake;3.22.1'

      - name: Build unsigned native release bundle
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Check native bundle contents
        run: |
          set -eu
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          unzip -Z1 "$bundle" > /tmp/native-bundle-files.txt
          grep -Fx 'base/lib/armeabi-v7a/libtoki_pona_native.so' /tmp/native-bundle-files.txt
          grep -Fx 'base/lib/arm64-v8a/libtoki_pona_native.so' /tmp/native-bundle-files.txt
          if grep -Eq '(^|/)classes[0-9]*\.dex$' /tmp/native-bundle-files.txt; then
            echo 'native bundle unexpectedly contains application DEX' >&2
            exit 1
          fi
          if grep -Fq 'base/assets/www/index.html' /tmp/native-bundle-files.txt; then
            echo 'native bundle unexpectedly contains the retired browser payload' >&2
            exit 1
          fi
